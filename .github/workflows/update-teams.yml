name: Refresh team directory

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch team/country directory from API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-teams.mjs

      - name: Commit updated data
        run: |
          git config user.name "matchpulse-bot"
          git config user.email "actions@github.com"
          git add public/data/teams.json public/data/teams-meta.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh team directory"
          git push
