name: Refresh match data

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch fixtures from football-data.org
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: node scripts/fetch-data.mjs
      - name: Commit updated data
        run: |
          git config user.name "matchpulse-bot"
          git config user.email "actions@github.com"
          git add public/data/*.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh match data"
          git push
